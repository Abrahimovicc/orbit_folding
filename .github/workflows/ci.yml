# Geometric Orbit Representatives for Unaligned 3D Tokenization
# Chair of Multimodal Machine Learning, ScaDS.AI Dresden/Leipzig
# Contact: Xiang Chen <xiang.chen@uni-leipzig.de>
# SPDX-License-Identifier: MIT
name: CPU Tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      distributed:
        description: Run optional two-rank CPU Gloo tests
        type: boolean
        default: false

permissions:
  contents: read

env:
  CUDA_VISIBLE_DEVICES: ""
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Open3D Runtime Libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install Package and Test Dependencies
        run: python -m pip install -e '.[dev,benchmark]'
      - name: Run Unit and CLI Tests
        run: python -m pytest -m 'not distributed'

  distributed:
    if: github.event_name == 'workflow_dispatch' && inputs.distributed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Open3D Runtime Libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1
      - name: Install CPU PyTorch
        run: python -m pip install 'torch==2.9.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Install Package and Test Dependencies
        run: python -m pip install -e '.[dev,benchmark]'
      - name: Run Two-Rank Tokenizer and Prior Tests
        run: python -m pytest -m distributed
