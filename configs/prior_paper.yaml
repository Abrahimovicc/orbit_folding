# Geometric Orbit Representatives for Unaligned 3D Tokenization
# Chair of Multimodal Machine Learning, ScaDS.AI Dresden/Leipzig
# Contact: Xiang Chen <xiang.chen@uni-leipzig.de>
# SPDX-License-Identifier: MIT
Task: prior
Description: Paper masked-completion architecture; requires matching tokenizer tokens
seed: 20260511
num_bits: 12
plane_res: 128
Tokenizer:
  codebook_size: 4096
batch_size: 8
num_workers: 4
epochs: 80
data:
  crop_size: 128
  val_ratio: 0.05
model:
  hidden_channels: 160
  num_blocks: 10
  dilations: [1, 2, 4, 8, 16, 32]
  dropout: 0.06
  mask_ratio_min: 0.05
  mask_ratio_max: 0.60
  uncond_prob: 0.05
  spatial_mask: true
optimizer:
  lr: 2.0e-4
  weight_decay: 0.01
  eta_min: 1.0e-5
Trainer:
  lr_scheduler_interval: epoch
Validation:
  mask_ratios: [0.1, 0.25, 0.5, 0.75, 0.9]
  selection_metric: mean_hidden_bce
